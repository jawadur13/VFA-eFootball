<!-- AI Chatbot Widget -->
<div id="vfa-chat-widget">
    <button id="chat-toggle-btn" aria-label="Open Chat">💬</button>
    <div id="chat-window">
        <div id="chat-header">
            <h4>🤖 RuleBot</h4>
            <button id="close-chat" aria-label="Close Chat">✖</button>
        </div>
        <div id="chat-messages">
            <div class="msg bot">
                ⚽ Welcome to RuleBot!<br><br>
                I'm the Official VFA Rule Assistant.<br><br>
                Ask me anything about:<br>
                • Tournament Rules<br>
                • Match Scheduling<br>
                • Smart Assist<br>
                • Disconnects<br>
                • Transfers<br>
                • Knockout Rules<br>
                • Penalties<br>
                • VPL & VCL<br><br>
                I'll answer using the official VFA Rulebook.
            </div>
        </div>
        <div class="typing-indicator" id="typing-indicator">📖 Checking the Rulebook...</div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask RuleBot about the VFA Rulebook..." autocomplete="off">
            <button id="send-btn">➤</button>
        </div>
    </div>
</div>
