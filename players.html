<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFA eFootball | Player Database</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .filter-section {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-container {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--vcl-gold);
            box-shadow: 0 0 10px rgba(255, 183, 0, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            width: 16px;
            height: 16px;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-chips .chip {
            padding: 8px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .filter-chips .chip:hover {
            border-color: var(--vpl-primary);
            color: var(--text-main);
        }

        .filter-chips .chip.active {
            background: var(--vpl-primary);
            border-color: var(--vpl-primary);
            color: white;
            box-shadow: 0 0 10px rgba(30, 144, 255, 0.3);
        }

        .select-filter {
            padding: 8px 15px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            min-width: 180px;
        }

        .select-filter option {
            background: var(--surface-card);
            color: var(--text-main);
        }

        /* Results styling */
        .results-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .database-table-container {
            position: relative;
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 50px;
        }

        .database-table {
            width: 100%;
            border-collapse: collapse;
        }

        .database-table th {
            background: rgba(255, 255, 255, 0.02);
            text-align: left;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .database-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(30, 144, 255, 0.15);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .player-row {
            transition: background-color 0.2s ease;
        }

        .player-row:hover {
            background-color: var(--surface-hover);
            cursor: pointer;
        }

        /* Pos Badges */
        .pos-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 800;
            text-align: center;
            min-width: 50px;
        }

        .pos-gk { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .pos-def { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
        .pos-mid { background: rgba(234, 179, 8, 0.15); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.3); }
        .pos-fwd { background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.3); }

        /* Loader */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            gap: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--vpl-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .team-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-logo-sm {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }
            .select-filter {
                width: 100%;
            }
            .database-table th, .database-table td {
                padding: 12px 10px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div id="main-header"></div>

    <main class="container" style="margin-top: 50px;">
        <header style="border-bottom: 1px solid var(--border-color); padding-bottom: 20px;">
            <h1>League Player Database</h1>
            <p style="color: var(--text-muted);">Quickly search and filter players across all 12 teams in VFA.</p>
        </header>

        <section class="filter-section">
            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="playerSearch" class="search-input" placeholder="Search by player name...">
            </div>

            <div class="controls-row">
                <div class="filter-chips">
                    <button class="chip active" data-pos="ALL">All Positions</button>
                    <button class="chip" data-pos="GK">GK</button>
                    <button class="chip" data-pos="DEF">DEF</button>
                    <button class="chip" data-pos="MID">MID</button>
                    <button class="chip" data-pos="FWD">FWD</button>
                </div>

                <select id="teamFilter" class="select-filter">
                    <option value="ALL">All Teams</option>
                </select>
            </div>

            <div class="results-info" id="resultsCount">Loading database...</div>
        </section>

        <div class="database-table-container">
            <div id="tableLoader" class="loader-container">
                <div class="spinner"></div>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Connecting to Google Sheets...</p>
            </div>

            <table class="database-table" id="dbTable" style="display: none;">
                <thead>
                    <tr>
                        <th style="width: 80px;">No.</th>
                        <th>Player Name</th>
                        <th style="width: 120px;">Position</th>
                        <th>Team</th>
                    </tr>
                </thead>
                <tbody id="players-body">
                    <!-- Injected via JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <div id="main-footer"></div>

    <script>
        const TEAMS_METADATA = [
            { name: "Astral Warriors", slug: "astral-warriors", manager: "Shahriyar Saikot", gid: "1594247792", logo: "astral-warriors.jpg" },
            { name: "Beast Era FC", slug: "beast-era-fc", manager: "Md Mainul Hasan", gid: "409816390", logo: "beast-era-fc.png" },
            { name: "Blaze Dominion FC", slug: "blaze-dominion-fc", manager: "HM Sanaullah", gid: "2094757150", logo: "blaze-dominion-fc.png" },
            { name: "The Hate Central FC", slug: "the-hate-central-fc", manager: "Tashil Tazim", gid: "1469856693", logo: "the-hate-central-fc.png" },
            { name: "Destroyers FC", slug: "destroyers-fc", manager: "Shahidul Islam Munna", gid: "811783032", logo: "destroyers-fc.jpg" },
            { name: "Dream Fail Team", slug: "dream-fail-team", manager: "Joy Antar Das", gid: "2044422590", logo: "dream-fail-team.jpg" },
            { name: "Invincible Gunners", slug: "invincible-gunners", manager: "Mahabubur Rahman Akash", gid: "2130635075", logo: "invincible-gunners.png" },
            { name: "Mystic Spyder", slug: "mystic-spyder", manager: "Mohammed Asif Khan", gid: "1096908608", logo: "mystic-spyder.jpg" },
            { name: "NR Elite", slug: "nr-elite", manager: "RI F AT", gid: "1280111257", logo: "nr-elite.png" },
            { name: "Scarlet Shield XI", slug: "scarlet-shield-xi", manager: "Shahriar Ayon", gid: "726712502", logo: "scarlet-shield-xi.png" },
            { name: "Star Vipers CF", slug: "star-vipers-cf", manager: "Sheikh Sajid", gid: "215251698", logo: "star-vipers-cf.jpg" },
            { name: "Wretchedly Terrible FC", slug: "wretchedly-terrible-fc", manager: "Jawadur Rafid", gid: "1818817428", logo: "wretchedly-terrible-fc.png" }
        ];

        let allPlayers = [];
        let currentSearch = '';
        let currentPosFilter = 'ALL';
        let currentTeamFilter = 'ALL';

        function parseCSV(text) {
            const lines = text.trim().split('\n').slice(1); // skip header
            return lines.map(line => {
                const cols = line.match(/(".*?"|[^,]+|(?<=,)(?=,)|^(?=,)|(?<=,)$)/g) || [];
                const clean = cols.map(c => c.replace(/^"|"$/g, '').trim());
                return {
                    name: clean[0] || '',
                    position: (clean[1] || '').toUpperCase(),
                };
            }).filter(p => p.name);
        }

        function getPosClass(pos) {
            switch (pos) {
                case 'GK': return 'pos-gk';
                case 'DEF': return 'pos-def';
                case 'MID': return 'pos-mid';
                case 'FWD': return 'pos-fwd';
                default: return '';
            }
        }

        function renderTable(players) {
            const tbody = document.getElementById('players-body');
            const countDisplay = document.getElementById('resultsCount');
            
            countDisplay.textContent = `Showing ${players.length} of ${allPlayers.length} players`;
            
            if (players.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px;">No matching players found.</td></tr>`;
                return;
            }

            tbody.innerHTML = players.map((p, i) => `
                <tr class="player-row" onclick="window.location.href='teams/${p.teamSlug}'">
                    <td>${i + 1}</td>
                    <td style="font-weight: 700; color: var(--text-main);">${p.name}</td>
                    <td><span class="pos-badge ${getPosClass(p.position)}">${p.position}</span></td>
                    <td>
                        <div class="team-cell">
                            <img class="team-logo-sm" src="assets/images/logos/${p.teamLogo}" onerror="this.src='assets/images/logos/VFA_logo.png'" alt="${p.teamName}">
                            <span>${p.teamName}</span>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filterAndRender() {
            const filtered = allPlayers.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(currentSearch.toLowerCase());
                const matchesPos = currentPosFilter === 'ALL' || p.position === currentPosFilter;
                const matchesTeam = currentTeamFilter === 'ALL' || p.teamSlug === currentTeamFilter;
                return matchesSearch && matchesPos && matchesTeam;
            });
            renderTable(filtered);
        }

        async function init() {
            // Setup Team dropdown
            const teamSelect = document.getElementById('teamFilter');
            TEAMS_METADATA.forEach(team => {
                const opt = document.createElement('option');
                opt.value = team.slug;
                opt.textContent = team.name;
                teamSelect.appendChild(opt);
            });

            // Set up Search Input
            document.getElementById('playerSearch').addEventListener('input', (e) => {
                currentSearch = e.target.value;
                filterAndRender();
            });

            // Set up Team Filter
            teamSelect.addEventListener('change', (e) => {
                currentTeamFilter = e.target.value;
                filterAndRender();
            });

            // Set up Position Chips
            document.querySelectorAll('.filter-chips .chip').forEach(button => {
                button.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-chips .chip').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentPosFilter = e.target.getAttribute('data-pos');
                    filterAndRender();
                });
            });

            // Fetch player lists
            try {
                const fetchPromises = TEAMS_METADATA.map(async (team) => {
                    const csvUrl = `https://docs.google.com/spreadsheets/d/e/2PACX-1vTNRLcKodSD9CAu-KbkHOifpeoQ3LLNWEOE4ac5KOyuJNxQGNM83W8WPAg-N97gOfFNV9KmF3FuJAyI/pub?gid=${team.gid}&single=true&output=csv`;
                    const res = await fetch(csvUrl);
                    if (!res.ok) throw new Error(`HTTP error ${res.status} fetching ${team.name}`);
                    const text = await res.text();
                    const players = parseCSV(text);
                    return players.map(p => ({
                        ...p,
                        teamName: team.name,
                        teamSlug: team.slug,
                        teamLogo: team.logo,
                        manager: team.manager
                    }));
                });

                const results = await Promise.all(fetchPromises);
                allPlayers = results.flat();

                // Sort players by Position: GK -> DEF -> MID -> FWD, then name
                const POSITION_ORDER = { 'GK': 1, 'DEF': 2, 'MID': 3, 'FWD': 4 };
                allPlayers.sort((a, b) => {
                    const orderA = POSITION_ORDER[a.position] || 99;
                    const orderB = POSITION_ORDER[b.position] || 99;
                    if (orderA !== orderB) return orderA - orderB;
                    return a.name.localeCompare(b.name);
                });

                // Hide loader and show table
                document.getElementById('tableLoader').style.display = 'none';
                document.getElementById('dbTable').style.display = 'table';

                renderTable(allPlayers);
            } catch (err) {
                console.error("Error loading player database:", err);
                document.getElementById('tableLoader').innerHTML = `
                    <p style="color: #ef4444; font-weight: bold;">Error loading players database.</p>
                    <p style="color: var(--text-muted); font-size: 0.85rem; max-width: 400px; text-align: center;">
                        There was an issue fetching the squad lists from the online spreadsheet. Check your internet connection or try again later.
                    </p>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
    <script src="assets/js/main.js"></script>
</body>
</html>
